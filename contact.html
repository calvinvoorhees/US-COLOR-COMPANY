<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONTACT - US COLOR COMPANY</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #F5F5F5;
            color: #000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
        }

        /* Fixed Minimal Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            z-index: 999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(245, 245, 245, 0.95);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            padding: 24px 48px;
            border-bottom: 1px solid #000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
            text-decoration: none;
            cursor: pointer;
        }

        .header-left img {
            height: 100px; 
            width: auto;
            display: block;
        }

        .company-name {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1;
            color: #000;
        }

        .header-nav {
            display: flex;
            align-items: stretch;
        }

        .header-nav a {
            display: flex;
            align-items: center;
            padding: 10px 24px;
            text-decoration: none;
            color: #000;
            font-weight: 900;
            font-size: 11px;
            letter-spacing: 1.5px;
            transition: all 0.2s ease;
        }

        .header-nav a.active {
            background-color: #000;
            color: #F5F5F5;
        }

        .header-nav a:hover {
            background-color: #000;
            color: #F5F5F5;
        }

        /* US Graphic Systems Grid & Contact Layout */
        main {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 148px;
        }

        .contact-grid {
            width: 80vw;
            max-width: 1000px;
            border-top: 1px solid #000;
            border-bottom: 1px solid #000;
            display: flex;
            flex-direction: column;
        }

        .contact-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 32px 24px;
            text-decoration: none;
            color: #000;
            border-bottom: 1px solid #000;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .contact-row:last-child {
            border-bottom: none;
        }

        .row-label {
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #666;
            transition: color 0.2s ease;
        }

        .row-value {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        @media (hover: hover) {
            .contact-row:hover {
                background-color: #000;
                color: #F5F5F5;
            }
            .contact-row:hover .row-label {
                color: #AAA;
            }
        }

        /* Responsive Settings */
        @media (max-width: 1200px) {
            header { padding: 20px 24px; }
            .header-left img { height: 70px; }
            .company-name { font-size: 16px; }
            .contact-grid { width: 92vw; }
            .row-value { font-size: 22px; }
        }

        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; gap: 12px; padding: 16px 20px; }
            .header-left img { height: 45px; }
            .company-name { font-size: 14px; }
            .header-nav { width: 100%; justify-content: space-between; }
            .header-nav a { padding: 8px 12px; font-size: 10px; }
            
            main { padding-top: 115px; }
            .contact-grid { width: 95vw; }
            .contact-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                padding: 24px 16px;
            }
            .row-label { font-size: 10px; }
            .row-value { font-size: 18px; letter-spacing: 0px; }

            .contact-row:active {
                background-color: #000;
                color: #F5F5F5;
            }
            .contact-row:active .row-label {
                color: #AAA;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="header-left">
            <img src="uscolorcompanyLOGO.PNG" alt="US COLOR COMPANY LOGO">
            <div class="company-name">US COLOR COMPANY</div>
        </a>
        <nav class="header-nav">
            <a href="index.html">WORK</a>
            <a href="about.html">ABOUT</a>
            <a href="contact.html" class="active">CONTACT</a>
        </nav>
    </header>

    <main>
        <div class="contact-grid">
            <a href="mailto:uscolorcompany@gmail.com" class="contact-row">
                <span class="row-label">EMAIL</span>
                <span class="row-value">USCOLORCOMPANY@GMAIL.COM</span>
            </a>
            
            <a href="https://instagram.com/uscolorcompany" target="_blank" rel="noopener noreferrer" class="contact-row">
                <span class="row-label">INSTAGRAM</span>
                <span class="row-value">USCOLORCOMPANY</span>
            </a>
        </div>
    </main>

</body>
</html>
