<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>US COLOR COMPANY</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #F5F5F5;
            color: #000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-transform: uppercase;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Fixed Minimal Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 148px;
            z-index: 999;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(245, 245, 245, 0.95);
            backdrop-filter: blur(5px);
            padding: 24px 48px;
            border-bottom: 1px solid #000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .header-left img {
            height: 100px; 
            width: auto;
            display: block;
        }

        .company-name {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1;
            color: #000;
        }

        .header-nav {
            display: flex;
            align-items: stretch;
        }

        .header-nav a {
            display: flex;
            align-items: center;
            padding: 10px 24px;
            text-decoration: none;
            color: #000;
            font-weight: 900;
            font-size: 11px;
            letter-spacing: 1.5px;
            transition: background-color 0s, color 0s;
        }

        .header-nav a.active {
            color: #000;
            background-color: transparent;
        }

        .header-nav a:hover {
            background-color: #000;
            color: #F5F5F5;
        }

        /* Perfectly Positioned Scroll Container Below Header */
        main {
            position: fixed;
            top: 148px;
            left: 0;
            width: 100vw;
            height: calc(100vh - 148px);
            overflow-y: scroll;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            background-color: #F5F5F5;
        }

        .project-row {
            position: relative;
            width: 100vw;
            height: 100%;
            min-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #F5F5F5;
            border-bottom: 1px solid #000;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        .project-frame {
            position: relative;
            width: 80vw;
            max-width: 1400px;
            aspect-ratio: 16 / 9;
            background-color: #F5F5F5;
            overflow: hidden;
            cursor: default;
        }

        .poster { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background-size: cover; 
            background-position: center; 
            z-index: 10; 
            transition: opacity 0.3s ease; 
        }

        .video-wrapper { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: 5; 
            background-color: #F5F5F5;
        }

        .video-wrapper iframe { 
            width: 100%; height: 100%; 
            pointer-events: auto; 
            transform: scale(1.35); 
        }

        /* Hover Overlay */
        .meta-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px;
            background: rgba(0,0,0,0.4);
            color: #FFF;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .project-frame:hover .poster { opacity: 0; }
        .project-frame:hover .meta-overlay { opacity: 1; }

        .meta-top {
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: 900;
        }

        .meta-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .meta-title {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .meta-director {
            font-size: 13px;
            letter-spacing: 1px;
            color: #CCC;
            font-weight: 900;
            margin-top: 6px;
        }

        .palette { 
            display: flex; 
            gap: 6px; 
        }
        .swatch { 
            width: 20px; 
            height: 20px; 
            border: 1px solid rgba(255,255,255,0.2); 
        }

        /* Custom In-Fullscreen Exit Button UI */
        .fullscreen-exit-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(0, 0, 0, 0.7);
            color: #FFF;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1.5px;
            cursor: pointer;
            z-index: 99999;
            display: none;
            transition: background 0.2s ease;
        }

        .fullscreen-exit-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
        }

        .project-frame:fullscreen .fullscreen-exit-btn,
        .project-frame:-webkit-full-screen .fullscreen-exit-btn,
        .project-frame:-ms-fullscreen .fullscreen-exit-btn {
            display: block;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            header { padding: 20px 24px; height: 110px; }
            main { top: 110px; height: calc(100vh - 110px); }
            .header-left img { height: 70px; }
            .company-name { font-size: 16px; }
            .project-frame { width: 92vw; }
        }

        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; gap: 16px; padding: 16px; height: 130px; }
            main { top: 130px; height: calc(100vh - 130px); }
            .header-left img { height: 50px; }
            .company-name { font-size: 14px; }
            .header-nav { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="uscolorcompanyLOGO.PNG" alt="US COLOR COMPANY LOGO">
            <div class="company-name">US COLOR COMPANY</div>
        </div>
        <nav class="header-nav">
            <a href="index.html" class="active">WORK</a>
            <a href="about.html">ABOUT</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </header>

    <main id="feed-container">
        <!-- Rows injected via JS -->
    </main>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const masterProjectCatalog = [
            {
                id: "MJjYElYwSnQ",
                poster: "worstfriend.jpg",
                year: "2026",
                genre: "MUSIC VIDEO",
                title: "WORST FRIEND",
                director: "JAXON RAY",
                colors: ["#151515", "#332222", "#553333", "#C4B9A5"]
            },
            {
                id: "zbEuFbgax4I",
                poster: "sisters.jpg",
                year: "2025",
                genre: "MUSIC VIDEO",
                title: "SISTERS: LIBERTY",
                director: "JAXON RAY",
                colors: ["#0D1B2A", "#415A77", "#778DA9", "#E0E1DD"]
            },
            {
                id: "5AFCwd9ylW8",
                poster: "lilyratchet.jpeg",
                year: "2026",
                genre: "NARRATIVE",
                title: "LILY RATCHET",
                director: "DOM LOPEZ",
                colors: ["#1A1A1A", "#4A5D23", "#8B4513", "#D3C5B4"]
            },
            {
                id: "n1TBUxlOryY",
                poster: "Pygmy.jpeg",
                year: "2026",
                genre: "NARRATIVE",
                title: "PYGMY",
                director: "JACOB FREIBERG",
                colors: ["#111111", "#333333", "#666666", "#CCCCCC"]
            },
            {
                id: "EAJ0jstt1n4",
                poster: "unleavened.jpeg",
                year: "2026",
                genre: "NARRATIVE",
                title: "UNLEAVENED",
                director: "RAINA JABLON",
                colors: ["#2C221E", "#5A4A42", "#8C7355", "#E3D5C6"]
            },
            {
                id: "w2CBEvLpNAE",
                poster: "boring.jpeg",
                year: "2026",
                genre: "COMMERCIAL",
                title: "BORING",
                director: "CALEB ARGUETA",
                colors: ["#202020", "#404040", "#707070", "#EAEAEA"]
            },
            {
                id: "dd3SpVXwUWY",
                poster: "ButWhatIf.jpeg",
                year: "2026",
                genre: "NARRATIVE",
                title: "BUT WHAT IF",
                director: "JAMES STEICHEN",
                colors: ["#1A1F2C", "#3F4C6B", "#6C7A89", "#D8D8D8"]
            },
            {
                id: "bHKoN1Yk1xs",
                poster: "slasher.jpg",
                year: "2025",
                genre: "NARRATIVE",
                title: "SLASHER SLASHER",
                director: "TAMRICK ELSE",
                colors: ["#110505", "#5C1D1D", "#A83232", "#D1B894"]
            },
            {
                id: "QMa25zeu9EQ",
                poster: "abandominium.jpg",
                year: "2025",
                genre: "DOCUMENTARY",
                title: "ABANDOMINIUM",
                director: "DOM LOPEZ",
                colors: ["#1A1C1E", "#38424B", "#62707D", "#9AA6B2"]
            },
            {
                id: "fMV2PuvFwe8",
                poster: "udrcabme.jpg",
                year: "2025",
                genre: "MUSIC VIDEO",
                title: "UDONTRLLYCAREABME",
                director: "HARI GANESH",
                colors: ["#121212", "#3A3A3A", "#606060", "#B0B0B0"]
            }
        ];

        const players = {};
        const feedContainer = document.getElementById('feed-container');

        function buildFeed() {
            masterProjectCatalog.forEach((project, index) => {
                const uniqueId = 'yt-player-' + index;
                const row = document.createElement('div');
                row.className = 'project-row';
                row.setAttribute('data-index', index);

                let swatchesHtml = '';
                project.colors.forEach(hex => {
                    swatchesHtml += `<div class="swatch" style="background: ${hex};"></div>`;
                });

                row.innerHTML = `
                    <div class="project-frame" id="frame-${index}">
                        <button class="fullscreen-exit-btn" id="exit-btn-${index}">EXIT FULLSCREEN</button>
                        <div class="poster" id="poster-${index}" style="background-image: url('${project.poster}');"></div>
                        <div class="video-wrapper"><div id="${uniqueId}"></div></div>
                        <div class="meta-overlay">
                            <div class="meta-top">${project.year} // ${project.genre}</div>
                            <div class="meta-bottom">
                                <div>
                                    <div class="meta-title">${project.title}</div>
                                    <div class="meta-director">DIR. ${project.director}</div>
                                </div>
                                <div class="palette">
                                    ${swatchesHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                feedContainer.appendChild(row);
            });
        }

        function initPlayers() {
            masterProjectCatalog.forEach((project, index) => {
                const uniqueId = 'yt-player-' + index;
                if (window.YT && window.YT.Player) {
                    players[uniqueId] = new YT.Player(uniqueId, {
                        videoId: project.id,
                        playerVars: { 
                            'autoplay': 0, 
                            'controls': 1, 
                            'mute': 0, 
                            'rel': 0, 
                            'showinfo': 0, 
                            'modestbranding': 1, 
                            'fs': 1, 
                            'disablekb': 0, 
                            'playsinline': 1,
                            'origin': window.location.origin 
                        },
                        events: { 
                            'onStateChange': (e) => { 
                                if(e.data === YT.PlayerState.ENDED) e.target.playVideo(); 
                                if(e.data === YT.PlayerState.PLAYING) {
                                    e.target.setPlaybackQuality('hd1080');
                                    e.target.unMute();
                                    const poster = document.getElementById('poster-' + index);
                                    if(poster) poster.style.opacity = '0';
                                }
                            }
                        }
                    });
                }
            });
        }

        function setupInteractions() {
            masterProjectCatalog.forEach((project, index) => {
                const frame = document.getElementById('frame-' + index);
                const exitBtn = document.getElementById('exit-btn-' + index);
                const playerKey = 'yt-player-' + index;
                const poster = document.getElementById('poster-' + index);

                if (frame) {
                    frame.addEventListener('mouseenter', () => {
                        const player = players[playerKey];
                        if (player && player.playVideo) {
                            player.unMute();
                            player.playVideo();
                        }
                    });

                    frame.addEventListener('mouseleave', () => {
                        const player = players[playerKey];
                        if (player && player.pauseVideo) {
                            player.pauseVideo();
                            if (poster) poster.style.opacity = '1';
                        }
                    });

                    frame.addEventListener('click', (e) => {
                        if (e.target === exitBtn) return;

                        if (!document.fullscreenElement) {
                            if (frame.requestFullscreen) {
                                frame.requestFullscreen();
                            } else if (frame.webkitRequestFullscreen) {
                                frame.webkitRequestFullscreen();
                            } else if (frame.msRequestFullscreen) {
                                frame.msRequestFullscreen();
                            }
                        }
                    });

                    if (exitBtn) {
                        exitBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (document.fullscreenElement) {
                                if (document.exitFullscreen) {
                                    document.exitFullscreen();
                                } else if (document.webkitExitFullscreen) {
                                    document.webkitExitFullscreen();
                                } else if (document.msExitFullscreen) {
                                    document.msExitFullscreen();
                                }
                            }
                        });
                    }
                }
            });
        }

        function setupObserver() {
            const mainEl = document.getElementById('feed-container');
            const observerOptions = {
                root: mainEl,
                threshold: 0.6 
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const index = entry.target.getAttribute('data-index');
                    const playerKey = 'yt-player-' + index;
                    const player = players[playerKey];
                    const poster = document.getElementById('poster-' + index);

                    if (entry.isIntersecting) {
                        if (player && player.playVideo) {
                            player.playVideo();
                        }
                    } else {
                        if (player && player.pauseVideo) {
                            player.pauseVideo();
                            if (poster) poster.style.opacity = '1';
                        }
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.project-row').forEach(row => {
                observer.observe(row);
            });
        }

        function onYouTubeIframeAPIReady() {
            buildFeed();
            initPlayers();
            setTimeout(() => {
                setupInteractions();
                setupObserver();
                const mainEl = document.getElementById('feed-container');
                if (mainEl) mainEl.scrollTop = 0;
                window.scrollTo(0, 0);
            }, 300);
        }

        if (window.YT && window.YT.Player) {
            buildFeed();
            initPlayers();
            setTimeout(() => {
                setupInteractions();
                setupObserver();
                const mainEl = document.getElementById('feed-container');
                if (mainEl) mainEl.scrollTop = 0;
                window.scrollTo(0, 0);
            }, 300);
        } else {
            buildFeed();
        }
    </script>
</body>
</html>
